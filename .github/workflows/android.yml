name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-invaders-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  desktop-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile desktop preview (Java 8 bytecode)
        run: |
          mkdir -p desktop/build
          javac --release 8 -d desktop/build desktop/DesktopPreview.java
          jar --create --file space-invaders-preview.jar --main-class DesktopPreview -C desktop/build .

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: space-invaders-desktop-preview
          path: space-invaders-preview.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate ephemeral signing keystore
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci.keystore" \
            -alias spaceinvaders \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Space Invaders CI, OU=Games, O=CI, L=SP, ST=SP, C=BR"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.keystore
          KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          KEY_ALIAS: spaceinvaders

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Space Invaders $GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk
